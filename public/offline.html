<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>오프라인 | ZERO ONE IT</title>
    <style>
      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #fafafa;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        width: 100%;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        padding: 48px 32px;
      }

      main > section {
        box-sizing: border-box;
        display: flex;
        width: 100%;
        max-width: 400px;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        border: 1px solid #e9eaeb;
        border-radius: 24px;
        background: #ffffff;
        padding: 48px 32px;
        text-align: center;
        box-shadow: 0 8px 24px rgb(0 0 0 / 12%);
      }

      svg {
        display: block;
        width: 40px;
        height: 40px;
        flex: none;
        color: #f63d68;
      }

      section > div {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      h1,
      p {
        margin: 0;
        word-break: keep-all;
      }

      h1 {
        color: #181d27;
        font-size: 24px;
        font-weight: 700;
        line-height: 37px;
      }

      p {
        color: #535862;
        font-size: 16px;
        font-weight: 400;
        line-height: 25px;
      }

      a {
        box-sizing: border-box;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #f63d68;
        padding: 0 24px;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        line-height: 22px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <svg
          viewBox="0 0 19 20"
          role="img"
          aria-label="ZERO ONE IT"
        >
          <path
            fill="currentColor"
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M9.375 0.625H18.75L9.375 10H18.75L9.375 19.375L0 19.375L9.375 10H0.00000119209L9.375 0.625Z"
          />
        </svg>
        <div>
          <h1>지금은 오프라인이에요</h1>
          <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
        </div>
        <a href="/">홈으로 다시 시도</a>
      </section>
    </main>
  </body>
</html>
