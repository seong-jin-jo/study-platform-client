# 개발(QA)환경 진입점. 운영(nginx.conf)과 같은 Sprint8 공개 SEO 규칙을 쓰고
# 포트만 다르다(운영 13755 / 개발 14855).
#
# 왜 개발에도 진입점을 두는가: 이 규칙이 운영에만 있으면 장애응답 전환·비정상
# 주소 거절 같은 계약을 운영에 올려보기 전까지 실환경에서 확인할 수 없다.
# 실제로 QA 검증에서 진입점 관련 항목이 "운영에서만 확인 가능"으로 남았다.
events {}

http {
    upstream zeroone_next_origin {
        server frontend:14855;
        keepalive 32;
    }

    server {
        listen 14855;
        server_name _;

        include /etc/nginx/conf.d/sprint8-public-seo-errors.conf;

        location / {
            proxy_pass http://zeroone_next_origin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
