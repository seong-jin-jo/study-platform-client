# Sprint8 public SEO ingress adapter.
# Context: include this file inside the production `server` block.
# Required upstream: `upstream zeroone_next_origin { server 127.0.0.1:3000; }`

# Nginx and Next both normalize parts of a URL before application middleware.
# Inspect the original request target globally. Query values are excluded.
server_tokens off;
error_page 418 =400 @zeroone_invalid_request;
if ($request_uri ~ "^//") {
    return 418;
}
if ($request_uri ~ "^[^?]*\\\\") {
    return 418;
}
if ($request_uri ~* "^[^?]*%(?:25){0,2}(?:00|0a|0d|2f|5c)") {
    return 418;
}
if ($request_uri ~* "^[^?]*(?:/|%(?:25){0,2}2f)(?:(?:\\.)|%(?:25){0,2}2e){1,2}(?=/|%(?:25){0,2}2f|\\?|$)") {
    return 418;
}

location = / {
    proxy_pass http://zeroone_next_origin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 500 502 503 504 =503 @zeroone_public_seo_503;
}

location ~ "^/(?:home|insights(?:/(?:koans(?:/[1-9][0-9]*)?|land/[^/]+|[^/]+))?|community(?:/(?:questions/[1-9][0-9]*|rooms/[1-9][0-9]*|[1-9][0-9]*))?|members/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})/?$" {
    proxy_pass http://zeroone_next_origin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 500 502 503 504 =503 @zeroone_public_seo_503;
}

location @zeroone_public_seo_503 {
    internal;
    # 상태 코드는 위 error_page의 `=503`이 고정한다. 본문은 잠긴 원문이나
    # 동작 버튼 없이 재시도와 안전한 이탈만 제공하는 계약용 안전 화면이다.
    root /etc/nginx/error-pages;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-App-Version "${APP_RELEASE}" always;
    add_header X-App-Commit "${APP_COMMIT}" always;
    try_files /503.txt =503;
}

location @zeroone_invalid_request {
    internal;
    root /etc/nginx/error-pages;
    try_files /400.txt =400;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-App-Version "${APP_RELEASE}" always;
    add_header X-App-Commit "${APP_COMMIT}" always;
}
